<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebGL Magazine</title>
    <meta name="description" content="An interactive 3D WebGL magazine and visual portfolio showcase powered by Three.js and GSAP." />
    <meta property="og:title" content="WebGL Magazine" />
    <meta property="og:description" content="An interactive 3D WebGL magazine and visual portfolio showcase powered by Three.js and GSAP." />
  </head>
  <body>
    <div
      id="app"
      class="h-[100dvh] text-amber-50/60 flex flex-col justify-between relative z-10 pointer-events-none"
    ></div>
    <div
      id="mode-switcher"
      class="fixed bottom-6 left-1/2 -translate-x-1/2 z-30 flex items-center gap-1.5 p-1.5 bg-neutral-950/80 backdrop-blur-md rounded-full border border-neutral-800/80 shadow-2xl text-xs font-sans"
    >
      <button
        id="btn-magazine"
        type="button"
        class="px-5 py-2 rounded-full font-medium transition-all duration-300 bg-amber-50 text-neutral-950 shadow-sm cursor-pointer active:scale-95"
      >
        3D Magazine
      </button>
      <button
        id="btn-vortex"
        type="button"
        class="px-5 py-2 rounded-full font-medium transition-all duration-300 text-neutral-400 hover:text-neutral-200 hover:bg-neutral-800/50 cursor-pointer active:scale-95"
      >
        Vortex Gallery
      </button>
      <button
        id="btn-spotify"
        type="button"
        class="px-5 py-2 rounded-full font-medium transition-all duration-300 text-neutral-400 hover:text-neutral-200 hover:bg-neutral-800/50 cursor-pointer active:scale-95"
      >
        Spotify Visualiser
      </button>
    </div>
    <canvas id="webgl"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
